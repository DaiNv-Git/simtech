server:
  port: 8080

spring:
  # ===== H2 Embedded Database (mỗi máy có data riêng) =====
  datasource:
    url: jdbc:h2:file:./data/gsm_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  
  # ===== MongoDB (giữ lại cho backward compatibility) =====
  data:
    mongodb:
      uri: 'mongodb://admin:MongoAdmin%402026%21Secure@72.60.41.168:27017/JapanSim?authSource=admin'
      auto-index-creation: true

# ===== GSM Configuration =====
gsm:
  # Default settings
  otp-only: true
  disable-data-on-startup: true
  default-call-duration: 10  # giây
  auto-record: true
  recording-path: C:/recording
  auto-scan-on-startup: true
  sms:
    min-interval-ms: 3000
    jitter-ms: 3000
    backup-scan-delay-ms: 5000
  
  # API settings
  api:
    base-url: https://be-user-sms-global.smsglobalhub.com/
  order-api:
    base-url: https://be-user-sms-global.smsglobalhub.com/
  
  # Test mode
  test-mode: true
  test-call-mode: true
  
  # Recording upload
  record:
    public-url: https://be-user-sms-global.smsglobalhub.com/uploads/records/
    upload-url: https://be-user-sms-global.smsglobalhub.com/api/upload/record
    callback-url: https://be-user-sms-global.smsglobalhub.com/api/gsm/call/receive
    upload-dir: /var/www/html/recordings
  
  recording:
    local-temp: C:/recording/temp

# ===== Recording Configuration =====
recording:
  save:
    path: C:/recording

# ===== SSH for remote upload (optional) =====
