# ===== Proxy Configuration =====
proxy:
  enabled: false
  base-port: 10001        # Port bắt đầu cho proxy (mỗi SIM +1)
  default-apn: rakuten.jp   # APN mặc định (Rakuten: rakuten.jp, Docomo: spmode.ne.jp)
  health-check-interval: 30000  # ms giữa mỗi lần health check
