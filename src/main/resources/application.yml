server:
  port: 8080

spring:
  application:
    name: simTech
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/gsm_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    mongodb:
      # Dùng cùng Mongo server cũ nhưng database mới phải là "simtech".
      uri: ${MONGODB_URI}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

gsm:
  otp-only: true
  disable-data-on-startup: true
  default-call-duration: 10
  auto-record: true
  recording-path: ${RECORDING_PATH:C:/recording}
  auto-scan-on-startup: true
  test-mode: false
  test-call-mode: false
  sms:
    min-interval-ms: 3000
    jitter-ms: 3000
    backup-scan-delay-ms: 5000
  recording:
    local-temp: ${RECORDING_TEMP_PATH:C:/recording/temp}

recording:
  save:
    path: ${RECORDING_PATH:C:/recording}

# ===== Telegram notifications =====
telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

# ===== Logging =====
logging:
  level:
    app.simsmartgsm: INFO
    org.springframework: WARN
